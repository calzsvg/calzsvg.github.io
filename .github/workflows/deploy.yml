name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Syntax errors in these files would break the site, so stop before deploying.
      - run: |
          for f in data/content.js assets/*.js; do node --check "$f"; done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Stamp this build's commit on asset URLs (busts the 10-min Pages cache) and
      # publish it in version.txt so open/cached pages can tell a newer build is live.
      - run: |
          v="${GITHUB_SHA::7}"
          echo "$v" > version.txt
          sed -i "s/__BUILD__/$v/g" *.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
